<section class="cv-skills cv-card" id="softskills">
  <h2>Soft Skills</h2>
  <div class="cv-skills__search">
    <input
      type="text"
      [(ngModel)]="query"
      placeholder="Buscar habilidad..."
      aria-label="Buscar habilidad en la lista de Soft Skills"
    />
  </div>
  <ng-container *ngIf="filteredSkills as results">
    <ul class="cv-skills__list" *ngIf="results.length > 0; else emptyState">
      <li *ngFor="let skill of results">{{ skill | capitalize }}</li>
    </ul>
    <ng-template #emptyState>
      <p class="cv-skills__empty">No se encontraron habilidades.</p>
    </ng-template>
  </ng-container>
</section>
