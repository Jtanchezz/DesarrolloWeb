<section
  class="cv-skills cv-card"
  id="softskills"
  [class.cv-card--standalone]="showBackLink"
>
  <header class="cv-skills__header" [class.cv-skills__header--compact]="!showBackLink">
    <h2>Soft Skills</h2>
    <a
      *ngIf="showBackLink"
      routerLink="/"
      class="cv-skills__back"
      aria-label="Volver al CV principal"
    >
      ← Volver al CV
    </a>
  </header>
  <div class="cv-skills__search">
    <input
      type="text"
      [(ngModel)]="query"
      placeholder="Buscar habilidad..."
      aria-label="Buscar habilidad en la lista de Soft Skills"
    />
  </div>
  <ng-container *ngIf="filteredSkills as results">
    <ul class="cv-skills__list" *ngIf="results.length > 0; else emptyState">
      <li *ngFor="let skill of results">{{ skill | capitalize }}</li>
    </ul>
    <ng-template #emptyState>
      <p class="cv-skills__empty">No se encontraron habilidades.</p>
    </ng-template>
  </ng-container>
</section>
