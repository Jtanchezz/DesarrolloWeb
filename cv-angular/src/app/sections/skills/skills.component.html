<section class="cv-skills" id="softskills">
  <h2>Soft Skills</h2>
  <div class="cv-skills__search">
    <input
      type="text"
      [(ngModel)]="query"
      placeholder="Buscar habilidad..."
      aria-label="Buscar habilidad en la lista de Soft Skills"
    />
  </div>
  <ul class="cv-skills__list">
    <li *ngFor="let skill of filteredSkills">{{ skill.name }}</li>
  </ul>
</section>
