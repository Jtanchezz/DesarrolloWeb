<section class="cv-experience cv-card" id="experiencia">
  <h2>Experiencia Laboral</h2>
  <div class="cv-experience__actions">
    <button
      type="button"
      (click)="toggleExperience()"
      [attr.aria-expanded]="showExperience"
      aria-controls="experience-table"
    >
      {{ showExperience ? 'Ocultar experiencia laboral' : 'Mostrar experiencia laboral' }}
    </button>
  </div>
  <table *ngIf="showExperience" id="experience-table">
    <caption>{{ caption }}</caption>
    <thead>
      <tr>
        <th scope="col">Periodo</th>
        <th scope="col">Empresa</th>
        <th scope="col">Puesto</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of items">
        <th scope="row">{{ item.period }}</th>
        <td>{{ item.company }}</td>
        <td>{{ item.role }}</td>
      </tr>
    </tbody>
    <tfoot>
      <tr>
        <td colspan="3">{{ footnote }}</td>
      </tr>
    </tfoot>
  </table>
  <nav class="cv-experience__nav" aria-label="Secciones de experiencia">
    <a
      routerLink="/experience/jobs"
      routerLinkActive="is-active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      Trabajos
    </a>
    <a routerLink="/experience/studies" routerLinkActive="is-active">Estudios</a>
  </nav>
  <router-outlet></router-outlet>
</section>
