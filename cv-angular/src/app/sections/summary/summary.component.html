<section class="cv-summary">
  <section class="cv-summary__block cv-card" id="tecnologias">
    <h2>Tecnologías Usadas</h2>
    <div class="cv-summary__badges">
      <span *ngFor="let badge of technologies" class="cv-summary__badge" [attr.data-tone]="badge.tone">
        {{ badge.label }}
      </span>
    </div>
  </section>
  <section class="cv-summary__block cv-card" id="lenguajes">
    <h2>Lenguajes de Programación</h2>
    <ul>
      <li *ngFor="let language of languages">{{ language.name }}</li>
    </ul>
  </section>
  <aside class="cv-summary__extra cv-card">
    <h3>Información adicional</h3>
    <ul>
      <li *ngFor="let item of extraInfo">
        <span class="cv-summary__extra-label">{{ item.label }}:</span>
        <span>{{ item.value }}</span>
      </li>
    </ul>
  </aside>
  <div class="cv-summary__actions">
    <button type="button" (click)="printCv()">Descargar CV en PDF</button>
  </div>
</section>
